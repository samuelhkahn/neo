[project]
name = "neo"
version = "1.0.0"
description = "NEO: Photometric super-resolution with AI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "reproject>=0.21.0",
]

[project.optional-dependencies]
rubin = [
    "pyvo>=1.5",
    "requests>=2.31",
]
train = [
    "comet-ml>=3.31",
    "matplotlib>=3.5",
    "opencv-python>=4.5",
    "scikit-image>=0.19",
    "scikit-learn>=1.0",
    "sep>=1.2",
    "torch>=2.6",
    "torchvision>=0.21",
    "tqdm>=4.62",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Linux (UCSC Lux, V100 = sm_70) gets CUDA 12.6 wheels; cu130 dropped Volta. macOS keeps PyPI torch.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]
