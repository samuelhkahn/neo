[project]
name = "neo"
version = "1.0.0"
description = "NEO: Photometric super-resolution with AI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "astropy>=6.0",
    "numpy>=1.26",
    "reproject>=0.21.0",
]

[project.optional-dependencies]
rubin = [
    "pyvo>=1.5",
    "requests>=2.31",
]
train = [
    "comet-ml>=3.31",
    "matplotlib>=3.5",
    "opencv-python>=4.5",
    "scikit-image>=0.19",
    "scikit-learn>=1.0",
    "sep>=1.2",
    # Lux runs glibc 2.17; torch 2.6.0 is the last release with wheels for it (2.7+ needs glibc 2.28).
    "torch>=2.6; sys_platform != 'linux'",
    "torch==2.6.0; sys_platform == 'linux'",
    "torchvision>=0.21; sys_platform != 'linux'",
    "torchvision==0.21.0; sys_platform == 'linux'",
    "tqdm>=4.62",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["neo"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
# The lock must always contain wheels installable on Lux (x86_64 Linux, glibc 2.17).
required-environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
# Newer releases of these ship only glibc >= 2.24-2.28 wheels; hold Linux at the last glibc-2.17 builds.
constraint-dependencies = [
    "numpy<2.3; sys_platform == 'linux'",
    "scipy<1.17; sys_platform == 'linux'",
    "scikit-learn<1.8; sys_platform == 'linux'",
    "scikit-image<0.26; sys_platform == 'linux'",
    "pillow<12.3; sys_platform == 'linux'",
    "contourpy<1.3.3; sys_platform == 'linux'",
]

# Linux (UCSC Lux: V100 = sm_70, glibc 2.17) gets torch 2.6.0 CUDA 12.4 wheels, the newest that
# satisfy both (torch >= 2.7 needs glibc 2.28; CUDA 13 dropped Volta). macOS keeps PyPI torch.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]
