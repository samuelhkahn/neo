; 12-step smoke test of the diffusion experiment: same data and code path as lux_diffusion.ini, tiny run.
; On Lux:  CONFIG=neo/configs/lux_diffusion_smoke.ini ENTRY=train_diffusion.py sbatch scripts/lux/smoke.sbatch

[DEFAULT]
hst_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/hr
hsc_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/lr
; validation during training sees only the select subset of val (neo/preprocess/leakage.py)
hst_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/hr
hsc_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/lr

[IDENTIFIER]
identifier = "lux_smoke_diffusion"

[COMET_PROJECT]
comet_project = neo-rubin-lsst

[COMET_TAG]
comet_tag = "lux smoke"

[MODEL]
generator = diffusion

[BATCH_SIZE]
batch_size = 4

[HSC_DIM]
hsc_dim = 100

[HST_DIM]
hst_dim = 600

[DATA_AUG]
data_aug = False
augment = shift_d4

[DISPLAY_STEPS]
display_steps = 5

[SAVE_STEPS]
save_steps = 100000

[CHECKPOINT]
ckpt_dir = ${NEO_DATA}/checkpoints/lux_smoke_diffusion
latest_every = 5

[DATALOADER]
num_workers = 4

[DIFFUSION]
train_steps = 12
lr = 0.0001
warmup_steps = 5
ema_decay = 0.999
crop_size = 256
sample_steps = 4
sample_every = 10
stats_batches = 2
