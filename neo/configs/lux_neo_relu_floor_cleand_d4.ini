; lux_neo_relu_floor_cleand.ini with the lossless D4 augmentation (augment = shift_d4: the whole-LR-
; pixel shifts plus a random one of the 8 square symmetries, 90-degree rotations and flips, applied
; alike to LR, HR and segmap; neo/data/augment.py). The floored runs' sky shows a texture locked to
; the image grid (the lattice in the validation figures), which a generator can only learn from
; pairs seen in one orientation; under D4 any fixed-orientation pattern is penalised in all 8.
; Departs from the paper, which trained without rotations or flips. Only change from
; lux_neo_relu_floor_cleand.ini besides the names. Trained from scratch, so it tests the recipe a
; final model would use (D4 from step 0), not whether D4 can undo a lattice already learned; it is
; compared at matched steps with lux_neo_relu_floor_cleand.ini's own checkpoints (the lattice was
; plain there by 150k). Launched as the pair's GPU 1 while that run continues from 750k on GPU 0
; (train_pair.sbatch resumes each from its own ckpt_dir; this one starts empty):
;   export CONFIG_A=neo/configs/lux_neo_relu_floor_cleand.ini CONFIG_B=neo/configs/lux_neo_relu_floor_cleand_d4.ini
;   G="-A gpuq -q gpuq -p gpuq -t 1-00:00:00 --export=ALL"
;   prev=$(sbatch --parsable $G scripts/lux/train_pair.sbatch)
;   for i in $(seq 2 10); do prev=$(sbatch --parsable $G --dependency=afterany:$prev scripts/lux/train_pair.sbatch); done

[DEFAULT]
hst_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/hr
hsc_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/lr
; validation during training sees only the select subset of val (neo/preprocess/leakage.py)
hst_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/hr
hsc_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/lr

[IDENTIFIER]
identifier = "lux_cosmosweb_i_neo_relu_floor_cleand_d4"

[COMET_PROJECT]
comet_project = neo-rubin-lsst

[COMET_TAG]
comet_tag = "lux LSST i -> HST F814W (COSMOS-Web) neo_relu_floor_cleand_d4"

[BATCH_SIZE]
batch_size = 8

[GAN_STEPS]
gan_steps = 2500000

[HSC_DIM]
hsc_dim = 100

[HST_DIM]
hst_dim = 600

[DATA_AUG]
; data_aug: the dataset's own random flips, off as in the published run.
; augment = shift: training views shifted by whole LR pixels within each stored cutout, no rotation
; or flip (neo/data/augment.py). The paper drew ~1.5M random crop positions; with ~36k stored
; cutouts, random shifts stand in for them. shift_d4 (here) adds the rotations/flips the paper never had.
; Validation is unaffected.
data_aug = False
augment = shift_d4

[DATASET]
; hsc_hr_8bit = wrap reproduces the paper code's 8-bit discriminator conditioning: hsc_hr went
; through ToPILImage() without a mode, i.e. uint8(255 * v) / 255 (neo/data/augment.py:paper_8bit).
; Applies to training and validation. wrap (keep the low 8 bits) is what the paper's torch 1.9 does
; on Lux x86: ToPILImage of [-1, -0.5, -0.004, 0, 0.3, 0.999, 1.2] gives [1 129 255 0 76 254 50].
hsc_hr_8bit = none
; hr_floor / lr_floor: the clip's lower bound in stored units, <= 0 (neo/data/floors.py; header)
hr_floor = -0.01
lr_floor = -0.2

[DISPLAY_STEPS]
; The paper's runs logged display_step = 25 (their Comet parameters; main:neo/configs/example.ini).
display_steps = 25
; Validation figures (6 images) every figure_steps steps instead: Comet accepts at most 100,000
; images per experiment, which every 25 steps reaches at ~417k; 500 gives 24,000 over 2M steps.
figure_steps = 500

[LR]
lr = 0.0002

[LAMBDA_RECON]
lambda_recon = 200

[LAMBDA_SEGMAP]
lambda_segmap = 200

[LAMBDA_VGG]
lambda_vgg = 1

[LAMBDA_ADV]
lambda_adv = 1

[DISC_UPDATE_FREQ]
disc_update_freq = 1

[PRETRAINED_GENERATOR]
pretrained_generator =

[PRETRAINED_DISCRIMINATOR]
pretrained_discriminator =

[SAVE_STEPS]
; Numbered checkpoints (kept) every N steps.
save_steps = 25000

[VGG_LOSS_WEIGHTS]
vgg_loss_weights = [0.0, 1.0, 1.0, 0.0, 0.0]

[DISC_LR]
disc_lr = 0.00002

[CHECKPOINT]
ckpt_dir = ${NEO_DATA}/checkpoints/lux_cosmosweb_i_neo_relu_floor_cleand_d4
; latest.pt (overwritten) every N steps; this is what --resume reads.
latest_every = 2000

[DATALOADER]
num_workers = 8

[MODEL]
; Only change from lux.ini: the generator.
; Arm A: the NEO U-Net with the decoder ReLU on (NeoReLUGenerator, 42.0 M parameters).
; Discriminator, losses, weights, optimizer, data and schedule unchanged.
generator = neo_relu
