; Diffusion SR experiment on UCSC Lux: same pairs, splits, preprocessing (ds9 log scale) and
; validation as lux.ini; the NEO GAN is replaced by a conditional EDM diffusion model.
; Train with train_diffusion.py (scripts/lux/train_diffusion.sbatch). Paths use ${NEO_DATA}.

[DEFAULT]
hst_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/hr
hsc_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/lr
; validation during training sees only the select subset of val (neo/preprocess/leakage.py)
hst_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/hr
hsc_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/lr

[IDENTIFIER]
identifier = "lux_cosmosweb_i_diffusion"

[COMET_PROJECT]
comet_project = neo-rubin-lsst

[COMET_TAG]
comet_tag = "lux LSST i -> HST F814W (COSMOS-Web) diffusion"

[MODEL]
generator = diffusion

[BATCH_SIZE]
batch_size = 8

[HSC_DIM]
hsc_dim = 100

[HST_DIM]
hst_dim = 600

[DATA_AUG]
; As lux.ini: the dataset's own flips off; random crop shifts on, no rotations or flips.
data_aug = False
augment = shift

[DATASET]
; Unlike the GAN configs, no 8-bit hsc_hr: the diffusion model is conditioned on hsc_hr itself, and
; the paper's 8-bit round trip only ever fed its discriminator.
hsc_hr_8bit = none

[DISPLAY_STEPS]
; EMA validation loss every N steps (full-cutout samples every [DIFFUSION] sample_every).
display_steps = 100

[SAVE_STEPS]
; Numbered checkpoints (kept) every N steps.
save_steps = 25000

[CHECKPOINT]
ckpt_dir = ${NEO_DATA}/checkpoints/lux_cosmosweb_i_diffusion
; latest.pt (overwritten) every N steps; this is what --resume reads.
latest_every = 2000

[DATALOADER]
num_workers = 8

[DIFFUSION]
train_steps = 1000000
lr = 0.0001
warmup_steps = 5000
grad_clip = 1.0
ema_decay = 0.9999
; Random 256 px training crops from the 624 px sampling window (neo/diffusion.py).
crop_size = 256
; U-Net: 64 base channels x (1,1,2,3,4) over 5 levels, 2 residual blocks per level (21.5 M params).
base_channels = 64
channel_mults = 1,1,2,3,4
blocks_per_level = 2
dropout = 0.0
; EDM (Karras et al. 2022) defaults.
sigma_data = 0.5
p_mean = -1.2
p_std = 1.2
; Heun steps when sampling (2 * steps - 1 network calls per image), for validation and predict.py.
sample_steps = 18
sample_every = 5000
; At each sample_every, also draw samples of one val image and log one draw (k = 1) against the
; mean (in linear flux) and median of the first k draws for each k listed, with the std of the
; draws (neo/eval/stack.py); 0 = off. At k = 2 mean and median coincide. All sizes share one set of
; max(k) draws, drawn stack_chunk at a time (the val batch is 8, so 8 fit in memory): 32 draws add
; ~2 min per sample_every on a V100.
stack_samples = 1,2,4,8,16,32
stack_chunk = 8
; Training batches (x batch_size cutouts) measured at the start of a run for the log-space
; normalization and the HR range that samples are clamped to.
stats_batches = 200
