; NEO with rotation-only augmentation (ablation of lux.ini): same pairs, settings and evaluation.
; Paths use ${NEO_DATA}, expanded from the environment by train.py.
; Hyperparameters follow the published best configuration (see example.ini).

[DEFAULT]
hst_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/hr
hsc_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/lr
; validation during training sees only the select subset of val (neo/preprocess/leakage.py)
hst_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/hr
hsc_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/lr

[IDENTIFIER]
identifier = "lux_cosmosweb_i_rot90"

[COMET_PROJECT]
comet_project = neo-rubin-lsst

[COMET_TAG]
comet_tag = "lux LSST i -> HST F814W (COSMOS-Web) rot90"

[BATCH_SIZE]
batch_size = 8

[GAN_STEPS]
gan_steps = 2000000

[HSC_DIM]
hsc_dim = 100

[HST_DIM]
hst_dim = 600

[DATA_AUG]
; Ablation of lux.ini's augmentation: random rotations by 0, 90, 180 or 270 degrees of the centre
; crop, no shifts, no flips (neo/data/augment.py:Rot90Dataset). Everything else as lux.ini.
data_aug = False
augment = rot90

[DATASET]
; hsc_hr_8bit = wrap reproduces the paper code's 8-bit discriminator conditioning: hsc_hr went
; through ToPILImage() without a mode, i.e. uint8(255 * v) / 255 (neo/data/augment.py:paper_8bit).
; Applies to training and validation. wrap (keep the low 8 bits) is what the paper's torch 1.9 does
; on Lux x86: ToPILImage of [-1, -0.5, -0.004, 0, 0.3, 0.999, 1.2] gives [1 129 255 0 76 254 50].
hsc_hr_8bit = wrap

[DISPLAY_STEPS]
; The paper's runs logged display_step = 25 (their Comet parameters; main:neo/configs/example.ini).
display_steps = 25

[LR]
lr = 0.0002

[LAMBDA_RECON]
lambda_recon = 200

[LAMBDA_SEGMAP]
lambda_segmap = 200

[LAMBDA_VGG]
lambda_vgg = 1

[LAMBDA_ADV]
lambda_adv = 1

[DISC_UPDATE_FREQ]
disc_update_freq = 1

[PRETRAINED_GENERATOR]
pretrained_generator =

[PRETRAINED_DISCRIMINATOR]
pretrained_discriminator =

[SAVE_STEPS]
; Numbered checkpoints (kept) every N steps.
save_steps = 25000

[VGG_LOSS_WEIGHTS]
vgg_loss_weights = [0.0, 1.0, 1.0, 0.0, 0.0]

[DISC_LR]
disc_lr = 0.00002

[CHECKPOINT]
ckpt_dir = ${NEO_DATA}/checkpoints/lux_cosmosweb_i_rot90
; latest.pt (overwritten) every N steps; this is what --resume reads.
latest_every = 2000

[DATALOADER]
num_workers = 8
