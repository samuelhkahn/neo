; 12-step smoke test for Lux: same data and code path as lux.ini, tiny run. Used by scripts/lux/smoke.sbatch.

[DEFAULT]
hst_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/hr
hsc_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/lr
hst_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val/hr
hsc_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val/lr

[IDENTIFIER]
identifier = "lux_smoke"

[COMET_PROJECT]
comet_project = neo-rubin-lsst

[COMET_TAG]
comet_tag = "lux smoke"

[BATCH_SIZE]
batch_size = 4

[GAN_STEPS]
gan_steps = 12

[HSC_DIM]
hsc_dim = 100

[HST_DIM]
hst_dim = 600

[DATA_AUG]
data_aug = True

[DISPLAY_STEPS]
display_steps = 5

[LR]
lr = 0.0002

[LAMBDA_RECON]
lambda_recon = 200

[LAMBDA_SEGMAP]
lambda_segmap = 200

[LAMBDA_VGG]
lambda_vgg = 1

[LAMBDA_ADV]
lambda_adv = 1

[DISC_UPDATE_FREQ]
disc_update_freq = 1

[PRETRAINED_GENERATOR]
pretrained_generator =

[PRETRAINED_DISCRIMINATOR]
pretrained_discriminator =

[SAVE_STEPS]
save_steps = 100000

[VGG_LOSS_WEIGHTS]
vgg_loss_weights = [0.0, 1.0, 1.0, 0.0, 0.0]

[DISC_LR]
disc_lr = 0.00002

[CHECKPOINT]
ckpt_dir = ${NEO_DATA}/checkpoints/lux_smoke
latest_every = 5

[DATALOADER]
num_workers = 4
