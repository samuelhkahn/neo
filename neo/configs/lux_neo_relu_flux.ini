; Screening arm on top of Arm A (lux_neo_relu.ini): the flux-consistency loss ([CONSISTENCY]
; below, neo/consistency.py). The generator's output is pushed through the LSST forward model
; (linear flux, HR -> LR units, Gaussian blur to the LSST PSF, 6x6 binning) and must reproduce
; the LSST input: a Huber loss in LR noise units, added to the generator's total like the other
; terms. Targets the source flux deficit (-10 to -16% vs HST in every run) and photometric bias.
; 300k steps, scored against Arm A's checkpoints at matched steps. Everything else is
; lux_neo_relu.ini's. Validation of the forward model and the choice of every value below:
; neo_outputs/scratch/screening_arms/probe/ (validate_forward_final.txt, fit_psf.txt,
; flux_ratio_check.txt, gradient_scale.txt, edge_test.txt, dynamics_paper_warmup.txt).
; Launch (both code screening arms on one node, one per GPU; scripts/lux/train_pair.sbatch):
;   CONFIG_A=neo/configs/lux_neo_relu_flux.ini CONFIG_B=neo/configs/lux_neo_relu_noise.ini \
;     sbatch scripts/lux/train_pair.sbatch

[DEFAULT]
hst_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/hr
hsc_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/lr
; validation during training sees only the select subset of val (neo/preprocess/leakage.py)
hst_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/hr
hsc_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/lr

[IDENTIFIER]
identifier = "lux_cosmosweb_i_neo_relu_flux"

[COMET_PROJECT]
comet_project = neo-rubin-lsst

[COMET_TAG]
comet_tag = "lux LSST i -> HST F814W (COSMOS-Web) neo_relu_flux"

[BATCH_SIZE]
batch_size = 8

[GAN_STEPS]
gan_steps = 300000

[HSC_DIM]
hsc_dim = 100

[HST_DIM]
hst_dim = 600

[DATA_AUG]
; data_aug: the dataset's own random flips, off as in the published run.
; augment = shift: training views shifted by whole LR pixels within each stored cutout, no rotation
; or flip (neo/data/augment.py). The paper drew ~1.5M random crop positions; with ~36k stored
; cutouts, random shifts stand in for them. shift_d4 would add rotations/flips the paper never had.
; Validation is unaffected.
data_aug = False
augment = shift

[DATASET]
; hsc_hr_8bit = wrap reproduces the paper code's 8-bit discriminator conditioning: hsc_hr went
; through ToPILImage() without a mode, i.e. uint8(255 * v) / 255 (neo/data/augment.py:paper_8bit).
; Applies to training and validation. wrap (keep the low 8 bits) is what the paper's torch 1.9 does
; on Lux x86: ToPILImage of [-1, -0.5, -0.004, 0, 0.3, 0.999, 1.2] gives [1 129 255 0 76 254 50].
hsc_hr_8bit = wrap

[DISPLAY_STEPS]
; The paper's runs logged display_step = 25 (their Comet parameters; main:neo/configs/example.ini).
display_steps = 25
; Validation figures (6 images) every figure_steps steps instead: Comet accepts at most 100,000
; images per experiment, which every 25 steps reaches at ~417k; 500 gives 24,000 over 2M steps.
figure_steps = 500

[LR]
lr = 0.0002

[LAMBDA_RECON]
lambda_recon = 200

[LAMBDA_SEGMAP]
lambda_segmap = 200

[LAMBDA_VGG]
lambda_vgg = 1

[LAMBDA_ADV]
lambda_adv = 1

[DISC_UPDATE_FREQ]
disc_update_freq = 1

[PRETRAINED_GENERATOR]
pretrained_generator =

[PRETRAINED_DISCRIMINATOR]
pretrained_discriminator =

[SAVE_STEPS]
; Numbered checkpoints (kept) every N steps.
save_steps = 25000

[VGG_LOSS_WEIGHTS]
vgg_loss_weights = [0.0, 1.0, 1.0, 0.0, 0.0]

[DISC_LR]
disc_lr = 0.00002

[CHECKPOINT]
ckpt_dir = ${NEO_DATA}/checkpoints/lux_cosmosweb_i_neo_relu_flux
; latest.pt (overwritten) every N steps; this is what --resume reads.
latest_every = 2000

[DATALOADER]
num_workers = 8

[MODEL]
; Only change from lux.ini: the generator.
; Arm A: the NEO U-Net with the decoder ReLU on (NeoReLUGenerator, 42.0 M parameters).
; Discriminator, losses, weights, optimizer, data and schedule unchanged.
generator = neo_relu

[CONSISTENCY]
; Only change from lux_neo_relu.ini. The section's presence turns the loss on (lambda > 0).
; Weight of the Huber flux-consistency loss inside the generator total (lambda_recon is 200).
; Measured on real batches (scratch/screening_arms/probe/gradient_scale.txt): at a trained-like
; state (HST with a 10% source flux deficit) the term's gradient on the output at lambda = 1 is
; ~0.8x the L1 term's (its log-space gradient grows with each pixel's linear flux, and it works
; in LR noise units), so lambda = 1 gives the two terms comparable pull. At initialisation the
; output is far from the data in linear flux and the term is ~100x the L1 term; at full weight
; from step 0 the generator did not learn the sky level in a local probe, so the weight ramps
; linearly from 0 over warmup_steps steps (dynamics_paper_warmup.txt).
lambda_consistency = 1
warmup_steps = 2000
; Effective LSST i-band PSF for the Gaussian blur, and the HST (ACS F814W) PSF, arcsec: the blur
; is their quadrature difference. The LSST core FWHM measured from source moments is 0.73-0.84"
; (varies by patch) but the coadd PSF has wings a Gaussian lacks: fitted pixel by pixel on real
; pairs, a 1.0" Gaussian matches the LR within +-4% from r = 0.4" to 1.6" apertures
; (fit_psf.txt; a Moffat beta = 3 of 0.8" or a core + 4" wing fit slightly better). This and
; flux_scale below are also what neo/consistency.py uses when a section leaves them out.
psf_lr_fwhm_arcsec = 1.0
psf_hr_fwhm_arcsec = 0.10
; Empirical LR / model(HST) flux ratio of real sources, folded into the unit factor: HST F814W
; (redder and wider than LSST i) shows 10-15% more flux than LSST i at every magnitude on both
; pair builds (r = 2.4" apertures, no model: flux_ratio_check.txt; the pixel-level fit with the
; 1.0" Gaussian gives 0.85, fit_psf.txt). Without it the loss would pull every source 10-15%
; below HST. The per-source scatter (+-10%, a colour term) is left to the Huber loss.
flux_scale = 0.87
; LSST sky noise per 0.2" pixel in nJy (3.3 on our pairs, both builds); converted to the pairs'
; stored LR units with their NJYPERPX header card, read from the first training pair, as is the
; HR -> LR unit factor (njy_per_px_hr / njy_per_px_lr may be given here to override the headers).
lr_noise_njy = 3.3
; LR pixels this close to the edge of the 100 px crop are left out: the PSF carries light across
; the crop boundary that the reflected border cannot know (edge_test.txt: p99 error 3.8 sigma on
; the edge pixel, 0.12 sigma on the 5th).
edge_px = 4
