; NEO training on UCSC Lux: LSST DP2 i-band (COSMOS) -> HST/ACS F814W (COSMOS-Web DR1).
; Paths use ${NEO_DATA}, expanded from the environment by train.py.
; Hyperparameters follow the published best configuration (see example.ini).

[DEFAULT]
hst_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/hr
hsc_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/lr
; validation during training sees only the select subset of val (neo/preprocess/leakage.py)
hst_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/hr
hsc_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/lr

[IDENTIFIER]
identifier = "lux_cosmosweb_i"

[COMET_PROJECT]
comet_project = neo-rubin-lsst

[COMET_TAG]
comet_tag = "lux LSST i -> HST F814W (COSMOS-Web)"

[BATCH_SIZE]
batch_size = 8

[GAN_STEPS]
gan_steps = 2000000

[HSC_DIM]
hsc_dim = 100

[HST_DIM]
hst_dim = 600

[DATA_AUG]
; data_aug: the dataset's own random flips, off as in the published run.
; augment = shift: training views shifted by whole LR pixels within each stored cutout, no rotation
; or flip (neo/data/augment.py). The paper drew ~1.5M random crop positions; with ~36k stored
; cutouts, random shifts stand in for them. shift_d4 would add rotations/flips the paper never had.
; Validation is unaffected.
data_aug = False
augment = shift

[DATASET]
; hsc_hr_8bit = wrap reproduces the paper code's 8-bit discriminator conditioning: hsc_hr went
; through ToPILImage() without a mode, i.e. uint8(255 * v) / 255 (neo/data/augment.py:paper_8bit).
; Applies to training and validation. Mode still to be confirmed against torch 1.9 on Lux x86:
; wrap (low 8 bits) vs saturate (clamp to 0..255).
hsc_hr_8bit = wrap

[DISPLAY_STEPS]
; The paper's runs logged display_step = 25 (their Comet parameters; main:neo/configs/example.ini).
display_steps = 25

[LR]
lr = 0.0002

[LAMBDA_RECON]
lambda_recon = 200

[LAMBDA_SEGMAP]
lambda_segmap = 200

[LAMBDA_VGG]
lambda_vgg = 1

[LAMBDA_ADV]
lambda_adv = 1

[DISC_UPDATE_FREQ]
disc_update_freq = 1

[PRETRAINED_GENERATOR]
pretrained_generator =

[PRETRAINED_DISCRIMINATOR]
pretrained_discriminator =

[SAVE_STEPS]
; Numbered checkpoints (kept) every N steps.
save_steps = 25000

[VGG_LOSS_WEIGHTS]
vgg_loss_weights = [0.0, 1.0, 1.0, 0.0, 0.0]

[DISC_LR]
disc_lr = 0.00002

[CHECKPOINT]
ckpt_dir = ${NEO_DATA}/checkpoints/lux_cosmosweb_i
; latest.pt (overwritten) every N steps; this is what --resume reads.
latest_every = 2000

[DATALOADER]
num_workers = 8
