; Diffusion arm "hstfocus": lux_diffusion.ini (same pairs, splits, preprocessing, model and
; validation) plus extra loss weight on the HST segmentation map, mirroring NEO's segmap L1 term,
; with half of the training crops centred on LR-detected sources (as in lrfocus). Weighting by the
; target tilts the learned distribution toward sources: expect better source morphology but
; possibly more ghosts. Trained alongside lux_diffusion_lrfocus.ini by
; scripts/lux/train_diffusion_pair.sbatch (one config per GPU). Paths use ${NEO_DATA}.

[DEFAULT]
hst_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/hr
hsc_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/lr
; validation during training sees only the select subset of val (neo/preprocess/leakage.py)
hst_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/hr
hsc_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val_select/lr

[IDENTIFIER]
identifier = "lux_cosmosweb_i_diffusion_hstfocus"

[COMET_PROJECT]
comet_project = neo-rubin-lsst

[COMET_TAG]
comet_tag = "lux LSST i -> HST F814W (COSMOS-Web) diffusion hstfocus"

[MODEL]
generator = diffusion

[BATCH_SIZE]
batch_size = 8

[HSC_DIM]
hsc_dim = 100

[HST_DIM]
hst_dim = 600

[DATA_AUG]
; As lux.ini: the dataset's own flips off; random crop shifts on, no rotations or flips.
data_aug = False
augment = shift

[DATASET]
; Unlike the GAN configs, no 8-bit hsc_hr: the diffusion model is conditioned on hsc_hr itself, and
; the paper's 8-bit round trip only ever fed its discriminator.
hsc_hr_8bit = none

[DISPLAY_STEPS]
; EMA validation loss every N steps (full-cutout samples every [DIFFUSION] sample_every).
display_steps = 100

[SAVE_STEPS]
; Numbered checkpoints (kept) every N steps.
save_steps = 25000

[CHECKPOINT]
ckpt_dir = ${NEO_DATA}/checkpoints/lux_cosmosweb_i_diffusion_hstfocus
; latest.pt (overwritten) every N steps; this is what --resume reads.
latest_every = 2000

[DATALOADER]
num_workers = 8

[DIFFUSION]
train_steps = 1000000
lr = 0.0001
warmup_steps = 5000
grad_clip = 1.0
ema_decay = 0.9999
; Random 256 px training crops from the 624 px sampling window (neo/diffusion.py).
crop_size = 256
; U-Net: 64 base channels x (1,1,2,3,4) over 5 levels, 2 residual blocks per level (21.5 M params).
base_channels = 64
channel_mults = 1,1,2,3,4
blocks_per_level = 2
dropout = 0.0
; EDM (Karras et al. 2022) defaults.
sigma_data = 0.5
p_mean = -1.2
p_std = 1.2
; Heun steps when sampling (2 * steps - 1 network calls per image), for validation and predict.py.
sample_steps = 18
sample_every = 5000
; At each sample_every, also draw this many samples of one val image and log one draw against
; their mean (in linear flux) and median, with the std of the draws (neo/eval/stack.py); 0 = off.
stack_samples = 8
; Training batches (x batch_size cutouts) measured at the start of a run for the log-space
; normalization and the HR range that samples are clamped to.
stats_batches = 200
; Source focus (neo/diffusion.py SourceFocus): mask of the loss's object term (none | lr | hst),
; its weight (NEO's lambda_segmap / lambda_recon; lux.ini has 200 / 200), and the fraction of
; training crops centred on sources detected in the LR image (always the LR mask).
object_mask = hst
object_weight = 1.0
source_crop_frac = 0.5
; LR source mask (lr_source_mask): threshold in sky sigmas, Gaussian smoothing and dilation,
; both in LR px.
mask_nsigma = 4.5
mask_smooth = 1.0
mask_dilate = 2
