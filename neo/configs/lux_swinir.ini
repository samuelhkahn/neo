; SwinIR drop-in on UCSC Lux: the NEO baseline (lux.ini) with only the generator swapped.
; Paths use ${NEO_DATA}, expanded from the environment by train.py.
; Hyperparameters follow the published best configuration (see example.ini).

[DEFAULT]
hst_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/hr
hsc_path_train = ${NEO_DATA}/pairs/cosmos_web_i/train/lr
hst_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val/hr
hsc_path_val = ${NEO_DATA}/pairs/cosmos_web_i/val/lr

[IDENTIFIER]
identifier = "lux_cosmosweb_i_swinir"

[COMET_PROJECT]
comet_project = neo-rubin-lsst

[COMET_TAG]
comet_tag = "lux LSST i -> HST F814W (COSMOS-Web), SwinIR generator"

[BATCH_SIZE]
batch_size = 8

[GAN_STEPS]
gan_steps = 2000000

[HSC_DIM]
hsc_dim = 100

[HST_DIM]
hst_dim = 600

[DATA_AUG]
; Flips only (lossless). Kept off for the baseline, matching the published run; enable for the ablation.
data_aug = False

[DISPLAY_STEPS]
display_steps = 100

[LR]
lr = 0.0002

[LAMBDA_RECON]
lambda_recon = 200

[LAMBDA_SEGMAP]
lambda_segmap = 200

[LAMBDA_VGG]
lambda_vgg = 1

[LAMBDA_ADV]
lambda_adv = 1

[DISC_UPDATE_FREQ]
disc_update_freq = 1

[PRETRAINED_GENERATOR]
pretrained_generator =

[PRETRAINED_DISCRIMINATOR]
pretrained_discriminator =

[SAVE_STEPS]
; Numbered checkpoints (kept) every N steps.
save_steps = 25000

[VGG_LOSS_WEIGHTS]
vgg_loss_weights = [0.0, 1.0, 1.0, 0.0, 0.0]

[DISC_LR]
disc_lr = 0.00002

[CHECKPOINT]
ckpt_dir = ${NEO_DATA}/checkpoints/lux_cosmosweb_i_swinir
; latest.pt (overwritten) every N steps; this is what --resume reads.
latest_every = 2000

[DATALOADER]
num_workers = 8

[MODEL]
; Only change from lux.ini: the generator. Discriminator, losses, weights, optimizer, data unchanged.
generator = swinir

[SWINIR]
; SwinIR classical-SR configuration (12.1 M parameters); x6 = x3 then x2 pixel shuffle, tanh output.
embed_dim = 180
depths = (6, 6, 6, 6, 6, 6)
num_heads = (6, 6, 6, 6, 6, 6)
window_size = 8
mlp_ratio = 2.0
num_feat = 64
; Gradient checkpointing: batch 8 needs ~57 GB without it, ~14 GB with it (V100s have 32 GB).
use_checkpoint = True
